<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · 云上游戏厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1026'/%3E%3Cpath d='M10 40c8-20 36-20 44 0' stroke='%234ade80' stroke-width='8' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='34' r='3' fill='%23eaf2ff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b1026;--ink:#eaf2ff;--muted:rgba(234,242,255,.6);
    --green:#4ade80;--green2:#22c55e;--snake:#4ade80;--head:#86efac;--food:#f472b6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(800px 500px at 80% -5%, rgba(74,222,128,.10) 0%, transparent 60%), var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:28px 16px 40px;
  }
  .back{
    align-self:flex-start;margin:0 auto 14px;width:min(100%,460px);
    color:var(--muted);text-decoration:none;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s ease;
  }
  .back:hover{color:var(--green)}
  h1{font-size:24px;font-weight:800;letter-spacing:.06em;margin-bottom:4px;text-align:center}
  .sub{font-size:13px;color:var(--muted);margin-bottom:18px;text-align:center}
  .hud{
    width:min(100%,460px);display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;font-variant-numeric:tabular-nums;
  }
  .hud .num{font-size:20px;font-weight:700;color:var(--green)}
  .hud .lbl{font-size:11px;letter-spacing:.2em;color:var(--muted)}
  .mute-btn{
    cursor:pointer;border:1px solid rgba(140,180,255,.2);background:rgba(20,28,64,.7);
    color:var(--muted);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
    transition:color .15s ease;font-size:15px;
  }
  .mute-btn.muted{color:rgba(234,242,255,.35)}
  .board-wrap{
    position:relative;width:min(100%,460px);aspect-ratio:1;border-radius:18px;overflow:hidden;
    background:#0e1433;border:1px solid rgba(74,222,128,.2);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:rgba(8,11,30,.82);text-align:center;padding:20px;transition:opacity .25s ease, visibility .25s ease;
  }
  .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .overlay h2{font-size:26px;font-weight:800}
  .overlay p{font-size:13px;color:var(--muted);line-height:1.8}
  .btn{
    cursor:pointer;border:0;border-radius:999px;padding:12px 34px;font-size:15px;font-weight:700;
    font-family:inherit;color:#06121f;background:linear-gradient(120deg,var(--green),#86efac);
    box-shadow:0 8px 24px rgba(74,222,128,.3);transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-2px) scale(1.02)}
  .btn:active{transform:scale(.97)}
  .controls{width:min(100%,460px);margin-top:14px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .key{
    font-size:12px;color:var(--muted);background:rgba(20,28,64,.7);
    border:1px solid rgba(140,180,255,.16);padding:7px 13px;border-radius:9px;
  }
  .key b{color:var(--green)}
  @media (max-width:480px){
    h1{font-size:21px}
    .controls{display:none}
  }
  @media (prefers-reduced-motion: reduce){.overlay{transition:none}}
</style>
</head>
<body>
  <a class="back" href="../index.html">← 返回游戏厅</a>
  <h1>贪吃蛇</h1>
  <div class="sub">吃食物变长，别撞墙也别咬到自己</div>
  <div class="hud">
    <div><div class="lbl">SCORE</div><div class="num" id="score">0</div></div>
    <div style="text-align:center"><div class="lbl">BEST</div><div class="num" id="best" style="color:var(--ink)">0</div></div>
    <button class="mute-btn" id="muteBtn" role="switch" aria-checked="true" aria-label="切换声音">♪</button>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="460" height="460"></canvas>
    <div class="overlay" id="startOv">
      <h2>准备好了吗</h2>
      <p>方向键 / WASD 控制移动<br>触屏设备滑动屏幕转向</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
    <div class="overlay hidden" id="overOv">
      <h2>游戏结束</h2>
      <p>本局得分 <b id="finalScore" style="color:var(--green)">0</b><br>最高分 <span id="finalBest" style="color:var(--ink)">0</span></p>
      <button class="btn" id="restartBtn">再来一局</button>
    </div>
  </div>
  <div class="controls">
    <div class="key"><b>←↑↓→</b> / <b>WASD</b> 转向</div>
    <div class="key"><b>空格</b> 暂停</div>
  </div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const N = 20, CELL = canvas.width / N;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = 460 * dpr; canvas.height = 460 * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);

  let state = "ready"; // ready|playing|paused|over
  let snake, dir, nextDir, food, score, best, timer, step, paused;
  const dirs = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
                KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]};

  // 音效
  let audioCtx = null, muted = false;
  try { muted = localStorage.getItem("jump-muted") === "1"; } catch(e) {}
  function ensureAudio(){ if(!audioCtx){ const AC = window.AudioContext||window.webkitAudioContext; if(AC) audioCtx = new AC(); } if(audioCtx && audioCtx.state==="suspended") audioCtx.resume(); }
  function beep(f0,f1,dur,type,vol){
    if(muted||!audioCtx) return;
    const t=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||"square"; o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f1||f0,t+dur);
    g.gain.setValueAtTime(vol||0.1,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.02);
  }
  const sfx={eat:()=>beep(520,780,0.08,"square",0.1), over:()=>beep(300,70,0.3,"sawtooth",0.15)};
  const muteBtn=document.getElementById("muteBtn");
  const syncMute=()=>{muteBtn.classList.toggle("muted",muted);muteBtn.setAttribute("aria-checked",String(!muted));muteBtn.textContent=muted?"×":"♪";};
  muteBtn.addEventListener("click",()=>{muted=!muted;try{localStorage.setItem("jump-muted",muted?"1":"0");}catch(e){}syncMute();});
  syncMute();

  function reset(){
    snake=[{x:7,y:10},{x:6,y:10},{x:5,y:10}];
    dir={x:1,y:0}; nextDir={x:1,y:0};
    score=0; step=0; paused=false;
    document.getElementById("score").textContent="0";
    spawnFood();
  }
  function spawnFood(){
    while(true){
      const fx=Math.floor(Math.random()*N), fy=Math.floor(Math.random()*N);
      if(!snake.some(s=>s.x===fx&&s.y===fy)){ food={x:fx,y:fy}; return; }
    }
  }
  function start(){
    ensureAudio(); reset(); state="playing";
    document.getElementById("startOv").classList.add("hidden");
    document.getElementById("overOv").classList.add("hidden");
    last=performance.now();
  }
  function gameOver(){
    state="over"; sfx.over();
    if(score>best){best=score;try{localStorage.setItem("jump-best-snake",String(best));}catch(e){}}
    document.getElementById("finalScore").textContent=score;
    document.getElementById("finalBest").textContent="最高分 "+best;
    document.getElementById("best").textContent=best;
    setTimeout(()=>{ if(state==="over") document.getElementById("overOv").classList.remove("hidden"); },380);
  }
  try{best=parseInt(localStorage.getItem("jump-best-snake")||"0",10)||0;}catch(e){best=0;}
  document.getElementById("best").textContent=best;

  function update(){
    // 转向：不允许直接反向
    if(nextDir.x!==-dir.x||nextDir.y!==-dir.y) dir={...nextDir};
    const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    // 撞墙
    if(head.x<0||head.y<0||head.x>=N||head.y>=N) return gameOver();
    // 撞自己（新头之外）
    if(snake.some((s,i)=>i<snake.length-1&&s.x===head.x&&s.y===head.y)) return gameOver();
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){ score++; sfx.eat(); document.getElementById("score").textContent=score; spawnFood(); }
    else snake.pop();
  }

  let last=0;
  function loop(ts){
    requestAnimationFrame(loop);
    const dt=Math.min((ts-last)/16.667,3); last=ts;
    if(state==="playing"){
      step+=dt;
      const interval=Math.max(70, 150 - score*2);
      while(step>=interval){ step-=interval; update(); if(state!=="playing")break; }
    }
    draw();
  }

  function draw(){
    ctx.fillStyle="#0e1433"; ctx.fillRect(0,0,460,460);
    // 网格
    ctx.strokeStyle="rgba(140,180,255,0.05)"; ctx.lineWidth=1;
    for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,460);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(460,i*CELL);ctx.stroke();}
    // 食物
    const t=Date.now()/300;
    ctx.fillStyle="#f472b6";
    ctx.save(); ctx.translate(food.x*CELL+CELL/2, food.y*CELL+CELL/2); ctx.rotate(t*0.5);
    ctx.fillRect(-CELL*0.3,-CELL*0.3,CELL*0.6,CELL*0.6); ctx.restore();
    // 蛇
    snake.forEach((s,i)=>{
      const c=s===snake[0]? "#86efac" : "#4ade80";
      ctx.fillStyle=c;
      const pad=1.5;
      ctx.beginPath();
      if(i===0) ctx.roundRect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, 6);
      else ctx.roundRect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, 5);
      ctx.fill();
    });
    // 蛇眼
    const h=snake[0];
    ctx.fillStyle="#0b1026";
    const ex=h.x*CELL+CELL/2+dir.x*5, ey=h.y*CELL+CELL/2+dir.y*5;
    ctx.beginPath(); ctx.arc(ex-3, ey, 2.2, 0, Math.PI*2); ctx.arc(ex+3, ey, 2.2, 0, Math.PI*2); ctx.fill();
    if(state==="paused"){
      ctx.fillStyle="rgba(8,11,30,.75)"; ctx.fillRect(0,0,460,460);
      ctx.fillStyle="#eaf2ff"; ctx.font="700 30px 'Segoe UI','PingFang SC',sans-serif"; ctx.textAlign="center";
      ctx.fillText("已暂停", 230, 230);
    }
  }

  // 输入
  document.addEventListener("keydown", e=>{
    if(dirs[e.code]){
      e.preventDefault();
      if(state==="ready") start();
      else if(state==="playing") nextDir={x:dirs[e.code][0],y:dirs[e.code][1]};
      else if(state==="over") start();
    } else if(e.code==="Space"){
      e.preventDefault();
      if(state==="playing"){paused=!paused;state=paused?"paused":"playing";}
      else if(state==="paused"){paused=false;state="playing";}
    }
  });
  let touchStart=null;
  canvas.addEventListener("pointerdown",e=>{
    if(state==="ready"){start();return;}
    if(state==="over"){start();return;}
    touchStart={x:e.clientX,y:e.clientY};
  });
  canvas.addEventListener("pointerup",e=>{
    if(!touchStart||state!=="playing")return;
    const dx=e.clientX-touchStart.x, dy=e.clientY-touchStart.y;
    if(Math.abs(dx)<12&&Math.abs(dy)<12)return;
    const nd=Math.abs(dx)>Math.abs(dy)? (dx>0?dirs.ArrowRight:dirs.ArrowLeft):(dy>0?dirs.ArrowDown:dirs.ArrowUp);
    nextDir={x:nd[0],y:nd[1]}; touchStart=null;
  });
  document.getElementById("startBtn").addEventListener("click",start);
  document.getElementById("restartBtn").addEventListener("click",start);
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
