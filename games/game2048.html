<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 · 云上游戏厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1026'/%3E%3Ctext x='32' y='42' font-size='26' font-weight='bold' fill='%23a78bfa' text-anchor='middle' font-family='Arial'%3E2048%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b1026;--ink:#eaf2ff;--muted:rgba(234,242,255,.6);
    --purple:#a78bfa;--violet:#8b5cf6;--cell:rgba(30,38,84,.7);--line:rgba(140,180,255,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(800px 500px at 80% -5%, rgba(167,139,250,.10) 0%, transparent 60%), var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:28px 16px 40px;
  }
  .back{
    width:min(100%,470px);margin-bottom:14px;color:var(--muted);text-decoration:none;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s ease;
  }
  .back:hover{color:var(--purple)}
  h1{font-size:24px;font-weight:800;letter-spacing:.06em;text-align:center}
  .sub{font-size:13px;color:var(--muted);margin:4px 0 18px;text-align:center}
  .hud{
    width:min(100%,470px);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  }
  .hud .num{font-size:20px;font-weight:700;color:var(--purple);font-variant-numeric:tabular-nums}
  .hud .lbl{font-size:11px;letter-spacing:.2em;color:var(--muted)}
  .btn{
    cursor:pointer;border:0;border-radius:999px;padding:9px 20px;font-size:13px;font-weight:700;
    font-family:inherit;color:#0b1026;background:linear-gradient(120deg,var(--purple),#c4b5fd);
    transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:scale(.97)}
  .board-wrap{position:relative;width:min(100%,470px);aspect-ratio:1}
  #board{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    background:#0e1433;border:1px solid var(--line);border-radius:18px;padding:10px;
    width:100%;height:100%;box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .cell{
    background:var(--cell);border-radius:10px;
    display:grid;place-items:center;
    font-size:34px;font-weight:800;color:#eaf2ff;
    font-variant-numeric:tabular-nums;
    transition:background .12s ease;
  }
  .tile-2{background:#1e2a5e;color:#c7d2fe}
  .tile-4{background:#253572;color:#c7d2fe}
  .tile-8{background:#3144a3;color:#fff}
  .tile-16{background:#4f46e5;color:#fff}
  .tile-32{background:#7c3aed;color:#fff}
  .tile-64{background:#9333ea;color:#fff}
  .tile-128{background:#a855f7;color:#fff;font-size:30px}
  .tile-256{background:#c026d3;color:#fff;font-size:30px}
  .tile-512{background:#db2777;color:#fff;font-size:30px}
  .tile-1024{background:#f472b6;color:#fff;font-size:24px}
  .tile-2048{background:#fcd34d;color:#0b1026;font-size:24px}
  .tile-super{background:#fbbf24;color:#0b1026;font-size:24px}
  .overlay{
    position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:rgba(8,11,30,.85);text-align:center;padding:20px;transition:opacity .25s ease, visibility .25s ease;
  }
  .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .overlay h2{font-size:26px;font-weight:800}
  .overlay p{font-size:13px;color:var(--muted);line-height:1.8}
  .overlay .btn{padding:12px 34px;font-size:15px;box-shadow:0 8px 24px rgba(167,139,250,.3)}
  .tip{width:min(100%,470px);margin-top:14px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8}
  @media (max-width:480px){
    h1{font-size:21px}
    .cell{font-size:26px;border-radius:8px}
    #board{gap:7px;padding:7px}
    .tile-128,.tile-256,.tile-512{font-size:22px}
    .tile-1024,.tile-2048,.tile-super{font-size:18px}
  }
  @media (prefers-reduced-motion: reduce){.overlay{transition:none}}
</style>
</head>
<body>
  <a class="back" href="../index.html">← 返回游戏厅</a>
  <h1>2048</h1>
  <div class="sub">合并相同数字，冲击 2048</div>
  <div class="hud">
    <div><div class="lbl">SCORE</div><div class="num" id="score">0</div></div>
    <div style="text-align:center"><div class="lbl">BEST</div><div class="num" id="best" style="color:var(--ink)">0</div></div>
    <button class="btn" id="newBtn">新游戏</button>
  </div>
  <div class="board-wrap">
    <div id="board"></div>
    <div class="overlay" id="startOv">
      <h2>2048</h2>
      <p>方向键 / WASD 移动方块<br>触屏滑动操作 · 相同数字会合并</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
    <div class="overlay hidden" id="overOv">
      <h2 id="overTitle">游戏结束</h2>
      <p>本局得分 <b id="finalScore" style="color:var(--purple)">0</b><br>最高分 <span id="finalBest" style="color:var(--ink)">0</span></p>
      <button class="btn" id="restartBtn">再来一局</button>
    </div>
  </div>
  <div class="tip">方向键 / WASD 或滑动屏幕移动 · 触屏设备滑动即可操作</div>
<script>
(() => {
  "use strict";
  const SIZE=4;
  let grid, score, best, state="ready"; // ready|playing|over
  const boardEl=document.getElementById("board");
  const dirVectors={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
                    KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]};
  try{best=parseInt(localStorage.getItem("jump-best-2048")||"0",10)||0;}catch(e){best=0;}
  document.getElementById("best").textContent=best;

  function emptyGrid(){return Array.from({length:SIZE},()=>Array(SIZE).fill(0));}
  function newGrid(){
    grid=emptyGrid(); score=0;
    document.getElementById("score").textContent="0";
    addTile(); addTile();
  }
  function addTile(){
    const empties=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!grid[r][c])empties.push([r,c]);
    if(!empties.length)return;
    const [r,c]=empties[Math.floor(Math.random()*empties.length)];
    grid[r][c]=Math.random()<0.9?2:4;
  }
  function render(){
    boardEl.innerHTML="";
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      const v=grid[r][c];
      const div=document.createElement("div");
      div.className="cell";
      if(v){
        let cls;
        if(v<=2)cls="tile-2";else if(v<=4)cls="tile-4";else if(v<=8)cls="tile-8";
        else if(v<=16)cls="tile-16";else if(v<=32)cls="tile-32";else if(v<=64)cls="tile-64";
        else if(v<=128)cls="tile-128";else if(v<=256)cls="tile-256";else if(v<=512)cls="tile-512";
        else if(v<=1024)cls="tile-1024";else if(v===2048)cls="tile-2048";else cls="tile-super";
        div.classList.add(cls);
        div.textContent=v;
      }
      boardEl.appendChild(div);
    }
  }
  // 滑一行：返回 {row, gained}
  function slideLine(line){
    const nums=line.filter(v=>v!==0);
    const out=[]; let gained=0;
    for(let i=0;i<nums.length;i++){
      if(i+1<nums.length&&nums[i]===nums[i+1]){
        out.push(nums[i]*2); gained+=nums[i]*2; i++;
      } else out.push(nums[i]);
    }
    while(out.length<SIZE)out.push(0);
    return {row:out,gained};
  }
  function move(dx,dy){
    let moved=false, gained=0;
    const newGrid=emptyGrid();
    // 行优先扫描，按移动方向确定顺序
    for(let i=0;i<SIZE;i++){
      let line=[];
      for(let j=0;j<SIZE;j++){
        const r=dx===0? (dy>0? (SIZE-1-j):j) : (dx>0? (SIZE-1-j):j);
        const c=dy===0? (dx>0? (SIZE-1-j):j) : (dx===0? j : i);
        line.push(grid[i][j]);
      }
      // 直接按行/列构造，简化：使用行列读取
      line=[];
      if(dx===0){
        for(let j=0;j<SIZE;j++) line.push(grid[j][i]);
      } else {
        for(let j=0;j<SIZE;j++) line.push(grid[i][j]);
      }
      const res=slideLine(line);
      gained+=res.gained;
      // 写回
      if(dx===0){
        for(let j=0;j<SIZE;j++){
          const row=(dy>0)? (SIZE-1-j):j;
          newGrid[row][i]=res.row[j];
        }
      } else {
        for(let j=0;j<SIZE;j++){
          const col=(dx>0)? (SIZE-1-j):j;
          newGrid[i][col]=res.row[j];
        }
      }
    }
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(grid[r][c]!==newGrid[r][c]) moved=true;
    if(moved){
      grid=newGrid; score+=gained;
      document.getElementById("score").textContent=score;
      if(score>best){best=score;try{localStorage.setItem("jump-best-2048",String(best));}catch(e){}document.getElementById("best").textContent=best;}
      addTile();
      render();
      if(!canMove()) gameOver();
      else if(has2048()) win();
    }
  }
  function canMove(){
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      if(!grid[r][c])return true;
      if(c+1<SIZE&&grid[r][c]===grid[r][c+1])return true;
      if(r+1<SIZE&&grid[r][c]===grid[r+1][c])return true;
    }
    return false;
  }
  function has2048(){return grid.some(row=>row.includes(2048));}
  function gameOver(){
    state="over";
    document.getElementById("overTitle").textContent="游戏结束";
    document.getElementById("finalScore").textContent=score;
    document.getElementById("finalBest").textContent="最高分 "+best;
    document.getElementById("overOv").classList.remove("hidden");
  }
  function win(){
    state="over";
    document.getElementById("overTitle").textContent="达成 2048！";
    document.getElementById("finalScore").textContent=score;
    document.getElementById("finalBest").textContent="最高分 "+best;
    document.getElementById("overOv").classList.remove("hidden");
  }
  function start(){
    newGrid(); render(); state="playing";
    document.getElementById("startOv").classList.add("hidden");
    document.getElementById("overOv").classList.add("hidden");
  }
  document.addEventListener("keydown",e=>{
    if(dirVectors[e.code]){
      e.preventDefault();
      if(state==="ready")start();
      else if(state==="playing"){const[dX,dY]=dirVectors[e.code];move(dX,dY);}
    }
  });
  let ts=null;
  document.addEventListener("pointerdown",e=>{if(state!=="playing")return;ts={x:e.clientX,y:e.clientY};});
  document.addEventListener("pointerup",e=>{
    if(!ts||state!=="playing")return;
    const dx=e.clientX-ts.x,dy=e.clientY-ts.y;ts=null;
    if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);
  });
  document.getElementById("newBtn").addEventListener("click",()=>{if(state==="ready")return;start();});
  document.getElementById("startBtn").addEventListener("click",start);
  document.getElementById("restartBtn").addEventListener("click",start);
  newGrid(); render();
})();
</script>
</body>
</html>
