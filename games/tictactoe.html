<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>井字棋 · 云上游戏厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1026'/%3E%3Cpath d='M16 16l32 32M48 16 16 48' stroke='%2322d3ee' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23f472b6' stroke-width='6'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b1026;--ink:#eaf2ff;--muted:rgba(234,242,255,.6);
    --cyan:#22d3ee;--pink:#f472b6;--line:rgba(140,180,255,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(800px 500px at 80% -5%, rgba(34,211,238,.10) 0%, transparent 60%), var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:28px 16px 40px;
  }
  .back{
    width:min(100%,470px);margin-bottom:14px;color:var(--muted);text-decoration:none;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s ease;
  }
  .back:hover{color:var(--cyan)}
  h1{font-size:24px;font-weight:800;letter-spacing:.06em;text-align:center}
  .sub{font-size:13px;color:var(--muted);margin:4px 0 18px;text-align:center}
  .hud{
    width:min(100%,470px);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  }
  .hud .num{font-size:20px;font-weight:700;color:var(--cyan);font-variant-numeric:tabular-nums}
  .hud .lbl{font-size:11px;letter-spacing:.2em;color:var(--muted)}
  .btn{
    cursor:pointer;border:0;border-radius:999px;padding:9px 20px;font-size:13px;font-weight:700;
    font-family:inherit;color:#0b1026;background:linear-gradient(120deg,var(--cyan),#67e8f9);
    transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:scale(.97)}
  .status{
    width:min(100%,470px);text-align:center;font-size:15px;margin-bottom:12px;
    min-height:22px;color:var(--muted);
  }
  .status b{color:var(--cyan)}
  .board-wrap{position:relative;width:min(100%,470px)}
  #board{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    background:#0e1433;border:1px solid var(--line);border-radius:18px;padding:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .tcell{
    aspect-ratio:1;border-radius:12px;background:rgba(30,38,84,.8);
    display:grid;place-items:center;cursor:pointer;
    transition:background .12s ease, transform .12s ease;
    font-size:clamp(40px,14vw,64px);font-weight:800;
  }
  .tcell:hover{background:rgba(45,56,110,.9)}
  .tcell:active{transform:scale(.96)}
  .tcell.x{color:var(--cyan)}
  .tcell.o{color:var(--pink)}
  .tcell.win{background:rgba(74,222,128,.18)}
  .tcell.dim{opacity:.35}
  .overlay{
    position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:rgba(8,11,30,.88);text-align:center;padding:20px;transition:opacity .25s ease, visibility .25s ease;
  }
  .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .overlay h2{font-size:26px;font-weight:800}
  .overlay p{font-size:13px;color:var(--muted);line-height:1.8}
  .overlay .btn{padding:12px 34px;font-size:15px;box-shadow:0 8px 24px rgba(34,211,238,.3)}
  .tip{width:min(100%,470px);margin-top:14px;font-size:12px;color:var(--muted);text-align:center}
  .tip b{color:var(--cyan)}
  @media (max-width:480px){h1{font-size:21px}}
  @media (prefers-reduced-motion: reduce){.overlay{transition:none}}
</style>
</head>
<body>
  <a class="back" href="../index.html">← 返回游戏厅</a>
  <h1>井字棋</h1>
  <div class="sub">三子连珠即胜 · 你是 ✕，AI 是 ○</div>
  <div class="hud">
    <div><div class="lbl">YOU</div><div class="num" id="wins" style="color:var(--cyan)">0</div></div>
    <div style="text-align:center"><div class="lbl">DRAW</div><div class="num" id="draws" style="color:var(--ink)">0</div></div>
    <div style="text-align:right"><div class="lbl">AI</div><div class="num" id="losses" style="color:var(--pink)">0</div></div>
  </div>
  <div class="status" id="status">轮到你落子</div>
  <div class="board-wrap">
    <div id="board"></div>
    <div class="overlay" id="startOv">
      <h2>井字棋</h2>
      <p>点击格子落子<br>与 AI 对战，三子连珠获胜</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
    <div class="overlay hidden" id="overOv">
      <h2 id="overTitle">本局结束</h2>
      <p id="overMsg">再来一局？</p>
      <button class="btn" id="restartBtn">再来一局</button>
    </div>
  </div>
  <div class="tip"><b>点击</b>空格落子 · 尽量阻止 AI 三连</div>
<script>
(() => {
  "use strict";
  let board, turn, state="ready", wins=0, draws=0, losses=0, aiThinking=false;
  const boardEl=document.getElementById("board");
  const statusEl=document.getElementById("status");
  try{
    wins=parseInt(localStorage.getItem("jump-ttt-wins")||"0",10)||0;
    draws=parseInt(localStorage.getItem("jump-ttt-draws")||"0",10)||0;
    losses=parseInt(localStorage.getItem("jump-ttt-losses")||"0",10)||0;
  }catch(e){}
  const save=()=>{try{localStorage.setItem("jump-ttt-wins",String(wins));localStorage.setItem("jump-ttt-draws",String(draws));localStorage.setItem("jump-ttt-losses",String(losses));}catch(e){}};
  function syncHud(){
    document.getElementById("wins").textContent=wins;
    document.getElementById("draws").textContent=draws;
    document.getElementById("losses").textContent=losses;
  }
  syncHud();
  const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function start(){
    board=Array(9).fill(null); turn="X"; state="playing"; aiThinking=false;
    statusEl.innerHTML="轮到你落子（<b>✕</b>）";
    render();
    document.getElementById("startOv").classList.add("hidden");
    document.getElementById("overOv").classList.add("hidden");
  }
  function render(){
    boardEl.innerHTML="";
    board.forEach((v,i)=>{
      const el=document.createElement("div");
      el.className="tcell"+(v===null?"":(v==="X"?" x":" o"));
      el.textContent=v==="X"?"✕":(v==="O"?"○":"");
      if(v===null)el.addEventListener("click",()=>playerMove(i));
      boardEl.appendChild(el);
    });
  }
  function winner(){
    for(const l of LINES){
      const [a,b,c]=l;
      if(board[a]&&board[a]===board[b]&&board[a]===board[c])return {player:board[a],line:l};
    }
    return null;
  }
  function playerMove(i){
    if(state!=="playing"||turn!=="X"||aiThinking||board[i])return;
    board[i]="X";
    const w=winner();
    if(w){endGame(w);return;}
    if(board.every(Boolean)){endGame(null);return;}
    turn="O";
    statusEl.innerHTML="AI 思考中…";
    render();
    aiThinking=true;
    setTimeout(aiMove, 420);
  }
  function aiMove(){
    if(state!=="playing")return;
    const i=bestMove();
    if(i===null){if(board.every(Boolean))endGame(null);aiThinking=false;return;}
    board[i]="O";
    aiThinking=false;
    const w=winner();
    if(w){endGame(w);return;}
    if(board.every(Boolean)){endGame(null);return;}
    turn="X";
    statusEl.innerHTML="轮到你落子（<b>✕</b>）";
    render();
  }
  // AI：先赢、再堵、再中心、再角落
  function bestMove(){
    // 直接赢
    for(let i=0;i<9;i++)if(!board[i]){board[i]="O";if(winner()){board[i]=null;return i;}board[i]=null;}
    // 堵玩家
    for(let i=0;i<9;i++)if(!board[i]){board[i]="X";if(winner()){board[i]=null;return i;}board[i]=null;}
    // 中心
    if(!board[4])return 4;
    // 角
    const corners=[0,2,6,8].filter(i=>!board[i]);
    if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
    // 边
    const edges=[1,3,5,7].filter(i=>!board[i]);
    if(edges.length)return edges[Math.floor(Math.random()*edges.length)];
    return null;
  }
  function endGame(w){
    state="over";
    const cells=[...boardEl.children];
    if(w){
      if(w.player==="X"){wins++;statusEl.innerHTML="你赢了！<b style='color:var(--cyan)'>✕</b>";}
      else{losses++;statusEl.innerHTML="AI 赢了 <b style='color:var(--pink)'>○</b>";}
      w.line.forEach(i=>cells[i].classList.add("win"));
      board.forEach((v,i)=>{if(!w.line.includes(i))cells[i].classList.add("dim");});
      document.getElementById("overTitle").textContent=w.player==="X"?"你赢了！":"AI 获胜";
      document.getElementById("overMsg").textContent=w.player==="X"?"漂亮的三连！":"再试一次吧";
    } else {
      draws++;
      statusEl.innerHTML="平局";
      document.getElementById("overTitle").textContent="平局";
      document.getElementById("overMsg").textContent="棋逢对手";
    }
    save(); syncHud();
    setTimeout(()=>{if(state==="over")document.getElementById("overOv").classList.remove("hidden");},550);
  }
  document.getElementById("startBtn").addEventListener("click",start);
  document.getElementById("restartBtn").addEventListener("click",start);
  // 初始：ready 状态，显示开始界面
  board=Array(9).fill(null); turn="X"; state="ready"; aiThinking=false;
  statusEl.innerHTML="轮到你落子（<b>✕</b>）";
  render();
})();
</script>
</body>
</html>
