<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞跃云端 · 跳跃闯关小游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1026'/%3E%3Ccircle cx='32' cy='30' r='14' fill='%23fcd34d'/%3E%3Cpath d='M14 30c-4 6-4 14 0 20' stroke='%2322d3ee' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M50 30c4 6 4 14 0 20' stroke='%2322d3ee' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg-1:#0b1026;
    --bg-2:#1a2151;
    --ink:#eaf2ff;
    --cyan:#22d3ee;
    --pink:#f472b6;
    --yellow:#fcd34d;
    --panel:rgba(13,18,44,.82);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 800px at 70% -10%, #1e2a6e 0%, var(--bg-1) 55%);
    color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;user-select:none;
  }
  .stage{
    position:relative;
    width:min(94vw, 460px);
    aspect-ratio:3/4.3;
    max-height:94vh;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(140,180,255,.14) inset;
    background:#0b1026;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ===== HUD ===== */
  .hud{
    position:absolute;top:0;left:0;right:0;padding:16px 18px 0;
    display:flex;align-items:flex-start;justify-content:space-between;
    pointer-events:none;z-index:3;
  }
  .score-box{text-align:left}
  .score-box .label{font-size:11px;letter-spacing:.28em;color:rgba(234,242,255,.62)}
  .score-box .num{font-size:38px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(34,211,238,.35)}
  .score-box .best{font-size:12px;color:rgba(234,242,255,.55);margin-top:2px;font-variant-numeric:tabular-nums}
  .mute-btn{
    pointer-events:auto;cursor:pointer;border:0;
    width:42px;height:42px;border-radius:12px;
    background:var(--panel);color:var(--cyan);
    display:grid;place-items:center;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
    transition:transform .15s ease, color .15s ease;
  }
  .mute-btn:hover{transform:translateY(-2px)}
  .mute-btn.muted{color:rgba(234,242,255,.4)}

  /* ===== 覆盖层 ===== */
  .overlay{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:26px;
    background:linear-gradient(180deg, rgba(8,11,30,.55) 0%, rgba(8,11,30,.88) 100%);
    backdrop-filter:blur(3px);
    transition:opacity .28s ease, visibility .28s ease;
  }
  .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:.24em;color:var(--cyan);
    padding:7px 14px;border:1px solid rgba(34,211,238,.4);border-radius:999px;
    margin-bottom:16px;
  }
  .title{
    font-size:44px;font-weight:900;line-height:1.1;letter-spacing:.04em;
    background:linear-gradient(120deg,#fff 20%,#7dd3fc 55%,#f9a8d4 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:6px;
  }
  .subtitle{font-size:14px;color:rgba(234,242,255,.68);margin-bottom:26px}
  .hint-row{
    display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;justify-content:center;
  }
  .hint-pill{
    font-size:12px;color:rgba(234,242,255,.75);
    background:var(--panel);border:1px solid rgba(140,180,255,.16);
    padding:8px 13px;border-radius:10px;
  }
  .hint-pill b{color:var(--yellow)}
  .start-btn{
    cursor:pointer;border:0;border-radius:999px;
    padding:15px 44px;font-size:17px;font-weight:700;color:#06121f;
    background:linear-gradient(120deg,var(--cyan),#67e8f9);
    box-shadow:0 10px 30px rgba(34,211,238,.35);
    transition:transform .16s ease, box-shadow .16s ease;
    font-family:inherit;
  }
  .start-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 14px 38px rgba(34,211,238,.45)}
  .start-btn:active{transform:scale(.97)}
  .restart-btn{
    cursor:pointer;border:0;border-radius:999px;
    padding:14px 38px;font-size:16px;font-weight:700;color:#06121f;
    background:linear-gradient(120deg,var(--pink),#f9a8d4);
    box-shadow:0 10px 30px rgba(244,114,182,.32);
    transition:transform .16s ease, box-shadow .16s ease;
    font-family:inherit;
  }
  .restart-btn:hover{transform:translateY(-2px) scale(1.03)}
  .restart-btn:active{transform:scale(.97)}
  .result .title{font-size:36px}
  .result-final{
    font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
    text-shadow:0 0 30px rgba(253,224,71,.35);
  }
  .result-best{font-size:14px;color:rgba(234,242,255,.6);margin:10px 0 24px;font-variant-numeric:tabular-nums}
  .result-best b{color:var(--yellow)}
  .tip{font-size:11px;color:rgba(234,242,255,.42);margin-top:14px;letter-spacing:.08em}
  .kbd{font-family:"Cascadia Mono",Consolas,monospace;font-size:.9em;background:rgba(255,255,255,.1);border-radius:4px;padding:1px 6px}
  .back{
    position:fixed;top:14px;left:14px;z-index:20;
    color:rgba(234,242,255,.7);text-decoration:none;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(13,18,44,.75);border:1px solid rgba(140,180,255,.16);
    padding:7px 14px;border-radius:999px;
    transition:color .15s ease;
  }
  .back:hover{color:var(--cyan)}
  @media (max-width:520px){
    .title{font-size:36px}
    .result .title{font-size:30px}
    .result-final{font-size:54px}
  }
  @media (prefers-reduced-motion: reduce){
    .overlay{transition:none}
    .start-btn,.restart-btn{transition:none}
  }
</style>
</head>
<body>
  <a class="back" href="../index.html">← 返回游戏厅</a>
  <main class="stage" id="stage">
    <canvas id="game" width="450" height="645"></canvas>

    <div class="hud">
      <div class="score-box">
        <div class="label">SCORE</div>
        <div class="num" id="scoreNum">0</div>
        <div class="best" id="bestLine">最高分 0</div>
      </div>
      <button class="mute-btn" id="muteBtn" role="switch" aria-checked="true" aria-label="切换声音" title="声音开关">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H2v6h4l5 4V5z"/>
          <path id="waveOn" d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path id="waveOn2" d="M18.5 5.5a9 9 0 0 1 0 13"/>
          <line id="muteLine" x1="15" y1="9" x2="22" y2="15" style="display:none"/>
          <line id="muteLine2" x1="22" y1="9" x2="15" y2="15" style="display:none"/>
        </svg>
      </button>
    </div>

    <!-- 开始界面 -->
    <div class="overlay" id="startOverlay">
      <div class="badge">ARCADE · JUMP</div>
      <div class="title">飞跃云端</div>
      <div class="subtitle">点击或按空格，让小鸟穿过柱子</div>
      <div class="hint-row">
        <div class="hint-pill"><b>点击</b> / 触屏</div>
        <div class="hint-pill">空格 / <span class="kbd">↑</span></div>
      </div>
      <button class="start-btn" id="startBtn">开始游戏</button>
      <div class="tip">每穿过一根柱子 +1 分 · 碰到柱子或地面即结束</div>
    </div>

    <!-- 结束界面 -->
    <div class="overlay hidden" id="overOverlay">
      <div class="result">
        <div class="title">本次得分</div>
        <div class="result-final" id="finalScore">0</div>
        <div class="result-best" id="finalBest">新纪录！</div>
        <button class="restart-btn" id="restartBtn">再来一局</button>
      </div>
      <div class="tip">按空格也可以重新开始</div>
    </div>
  </main>

<script>
(() => {
  "use strict";
  // ===== 画布与渲染适配 =====
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // 高清屏适配
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const CSS_W = W, CSS_H = H;

  // ===== 状态 =====
  const ST = { READY:0, PLAYING:1, OVER:2 };
  let state = ST.READY;
  let bird, pipes, groundX, score, best, frame, starField, clouds, city;
  const KEY = {
    SPACE:"Space", UP:"ArrowUp", W:"KeyW"
  };
  const isTouch = matchMedia("(pointer: coarse)").matches;

  // ===== 音效（Web Audio 合成，user gesture 后启用） =====
  let audioCtx = null, muted = false;
  try { muted = localStorage.getItem("jump-muted") === "1"; } catch(e) {}
  function ensureAudio(){
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq0, freq1, dur, type, vol){
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq0, t);
    osc.frequency.exponentialRampToValueAtTime(freq1 || freq0, t + dur);
    gain.gain.setValueAtTime(vol || 0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  const sfx = {
    flap:  () => beep(420, 640, 0.09, "square", 0.10),
    score: () => { beep(880, 1320, 0.10, "sine", 0.14); setTimeout(()=>beep(1320,1760,0.12,"sine",0.12), 80); },
    hit:   () => { beep(240, 70, 0.28, "sawtooth", 0.18); }
  };
  const muteBtn = document.getElementById("muteBtn");
  const syncMuteUI = () => {
    muteBtn.classList.toggle("muted", muted);
    muteBtn.setAttribute("aria-checked", String(!muted));
    muteBtn.querySelector("#waveOn").style.display = muted ? "none" : "";
    muteBtn.querySelector("#waveOn2").style.display = muted ? "none" : "";
    muteBtn.querySelector("#muteLine").style.display = muted ? "" : "none";
    muteBtn.querySelector("#muteLine2").style.display = muted ? "" : "none";
  };
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    try { localStorage.setItem("jump-muted", muted ? "1" : "0"); } catch(e) {}
    syncMuteUI();
  });
  syncMuteUI();

  // ===== 初始化场景 =====
  function buildScene(){
    starField = [];
    for (let i = 0; i < 46; i++){
      starField.push({
        x: Math.random()*W,
        y: Math.random()*H*0.72,
        r: Math.random()*1.2 + 0.5,
        tw: Math.random()*Math.PI*2,
        sp: 0.5 + Math.random()*1.4
      });
    }
    clouds = [
      {x: W*0.12, y: H*0.12, s: 1.0, v: 0.22},
      {x: W*0.55, y: H*0.22, s: 0.7, v: 0.16},
      {x: W*0.85, y: H*0.10, s: 0.85, v: 0.28}
    ];
    city = [];
    const cBase = H*0.80;
    let x = -10;
    while (x < W + 20){
      const bw = 26 + Math.random()*30;
      const bh = 30 + Math.random()*70;
      city.push({x, w:bw, h:bh, base:cBase});
      x += bw + 3;
    }
  }

  function reset(){
    bird = { x: W*0.30, y: H*0.42, r: 14, vy: 0, rot: 0, wing: 0 };
    pipes = [];
    groundX = 0;
    score = 0;
    frame = 0;
    document.getElementById("scoreNum").textContent = "0";
    buildScene();
  }

  // ===== 柱子生成 =====
  const PIPE_W = 62;
  const PIPE_GAP = 168;
  const PIPE_SPACING = 232;
  const GROUND_H = 86;
  function addPipe(){
    const margin = 70;
    const gapY = margin + Math.random() * (H - GROUND_H - margin*2 - PIPE_GAP);
    pipes.push({ x: W + 30, gapY, passed: false });
  }

  // ===== 物理 =====
  const GRAVITY = 0.52;
  const FLAP_VY = -8.6;
  const MAX_FALL = 11;
  const BASE_SPEED = 3.1;

  function flap(){
    if (state !== ST.PLAYING) return;
    bird.vy = FLAP_VY;
    sfx.flap();
  }

  // ===== 碰撞检测（圆 vs 矩形，容错一点） =====
  function circleRectHit(cx, cy, r, rx, ry, rw, rh){
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx*dx + dy*dy < (r-1.5)*(r-1.5);
  }

  function checkHit(){
    if (bird.y + bird.r >= H - GROUND_H) return true; // 地面
    if (bird.y - bird.r <= 0) return true;            // 顶部
    for (const p of pipes){
      const topH = p.gapY;
      const botY = p.gapY + PIPE_GAP;
      if (circleRectHit(bird.x, bird.y, bird.r, p.x, 0, PIPE_W, topH)) return true;
      if (circleRectHit(bird.x, bird.y, bird.r, p.x, botY, PIPE_W, H - GROUND_H - botY)) return true;
    }
    return false;
  }

  // ===== 主循环 =====
  let last = 0, rafId = null;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function loop(ts){
    rafId = requestAnimationFrame(loop);
    if (!last) last = ts;
    const dt = Math.min((ts - last) / 16.667, 2.5); // 以60fps为基准的增量
    last = ts;

    if (state === ST.PLAYING){
      frame += dt;
      // 鸟
      bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
      bird.y += bird.vy * dt;
      bird.rot = Math.max(-0.42, Math.min(1.15, bird.vy * 0.085));
      bird.wing += dt * (0.9 + Math.min(2.4, Math.abs(bird.vy)*0.16));

      // 地面滚动
      groundX = (groundX - BASE_SPEED * dt) % 40;

      // 生成与移动柱子
      if (pipes.length === 0 || W + 30 - pipes[pipes.length-1].x >= PIPE_SPACING){
        addPipe();
      }
      for (const p of pipes) p.x -= BASE_SPEED * dt;
      pipes = pipes.filter(p => p.x + PIPE_W > -20);

      // 计分
      for (const p of pipes){
        if (!p.passed && p.x + PIPE_W < bird.x){
          p.passed = true;
          score++;
          document.getElementById("scoreNum").textContent = score;
          sfx.score();
        }
      }

      // 碰撞
      if (checkHit()) gameOver();
    }

    draw();
  }

  function gameOver(){
    state = ST.OVER;
    sfx.hit();
    if (score > best){
      best = score;
      try { localStorage.setItem("jump-best", String(best)); } catch(e) {}
    }
    document.getElementById("finalScore").textContent = score;
    document.getElementById("finalBest").innerHTML =
      score > 0 && score >= best && best > 0
        ? "新纪录！最高分 " + best
        : "最高分 " + best;
    document.getElementById("bestLine").textContent = "最高分 " + best;
    setTimeout(() => {
      if (state === ST.OVER){
        document.getElementById("overOverlay").classList.remove("hidden");
      }
    }, 420);
  }

  // ===== 绘制 =====
  function draw(){
    // 天空
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b1026");
    g.addColorStop(0.55, "#1b2357");
    g.addColorStop(0.85, "#2b2f6e");
    g.addColorStop(1, "#3a2f66");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 星星
    for (const s of starField){
      s.tw += s.sp * 0.05;
      const a = 0.35 + 0.5 * Math.abs(Math.sin(s.tw));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#dfe9ff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 月亮
    ctx.fillStyle = "#f5f3ff";
    ctx.beginPath(); ctx.arc(W*0.82, H*0.10, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fefce8";
    ctx.beginPath(); ctx.arc(W*0.82, H*0.10, 20, 0, Math.PI*2); ctx.fill();

    // 云
    ctx.fillStyle = "rgba(210,225,255,0.10)";
    for (const c of clouds){
      if (!reduceMotion) c.x += c.v * 0.5;
      if (c.x > W + 60) c.x = -60;
      drawCloud(c.x, c.y, c.s);
    }

    // 城市剪影
    ctx.fillStyle = "rgba(10,14,38,0.75)";
    for (const b of city){
      ctx.fillRect(b.x, b.base - b.h, b.w, b.h);
    }

    // 地面
    const groundY = H - GROUND_H;
    const gg = ctx.createLinearGradient(0, groundY, 0, H);
    gg.addColorStop(0, "#222a5e");
    gg.addColorStop(1, "#141a3d");
    ctx.fillStyle = gg;
    ctx.fillRect(0, groundY, W, GROUND_H);
    // 地面纹理（滚动）
    ctx.fillStyle = "rgba(120,200,255,0.28)";
    for (let i = -2; i < W/40 + 2; i++){
      const gx = i*40 + groundX;
      ctx.beginPath();
      ctx.moveTo(gx, groundY + 6);
      ctx.lineTo(gx + 20, groundY + 20);
      ctx.lineTo(gx + 40, groundY + 6);
      ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    ctx.fillRect(0, groundY, W, 2);

    // 柱子
    for (const p of pipes){
      drawPipe(p.x, 0, PIPE_W, p.gapY, true);
      drawPipe(p.x, p.gapY + PIPE_GAP, PIPE_W, H - GROUND_H - (p.gapY + PIPE_GAP), false);
    }

    // 小鸟
    drawBird();

    // 就绪态提示
    if (state === ST.READY){
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.font = "500 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(isTouch ? "点击屏幕开始" : "按空格或点击开始", W/2, H*0.66);
    }
  }

  function drawCloud(x, y, s){
    ctx.beginPath();
    ctx.arc(x, y, 22*s, 0, Math.PI*2);
    ctx.arc(x+26*s, y-8*s, 17*s, 0, Math.PI*2);
    ctx.arc(x+50*s, y, 20*s, 0, Math.PI*2);
    ctx.fill();
  }

  function drawPipe(x, y, w, h, isTop){
    const grad = ctx.createLinearGradient(x, 0, x+w, 0);
    grad.addColorStop(0, "#0e7490");
    grad.addColorStop(0.35, "#22d3ee");
    grad.addColorStop(0.6, "#22d3ee");
    grad.addColorStop(1, "#0e7490");
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);
    // 高光
    ctx.fillStyle = "rgba(255,255,255,0.30)";
    ctx.fillRect(x + 8, y, 6, h);
    // 边缘帽
    const capH = 26;
    const capY = isTop ? y + h - capH : y;
    ctx.fillStyle = "#0f8fb0";
    ctx.fillRect(x - 4, capY, w + 8, capH);
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    ctx.fillRect(x + 4, capY, 6, capH);
  }

  function drawBird(){
    const b = bird;
    // 影子（在地面附近淡化）
    if (b.y > H - GROUND_H - 40){
      const t = Math.min(1, (H - GROUND_H - b.y) / 40);
      ctx.globalAlpha = t * 0.25;
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.ellipse(b.x, H - GROUND_H + 4, 16, 5, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);

    // 翅膀
    const wingUp = Math.sin(b.wing) > 0;
    ctx.fillStyle = "#c7d2fe";
    ctx.beginPath();
    ctx.ellipse(wingUp ? -10 : -12, wingUp ? 4 : 10, 11, 7, wingUp ? -0.9 : 0.3, 0, Math.PI*2);
    ctx.fill();

    // 身体
    const bg = ctx.createRadialGradient(-4, -6, 2, 0, 0, 20);
    bg.addColorStop(0, "#fef3c7");
    bg.addColorStop(1, "#fbbf24");
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI*2);
    ctx.fill();

    // 肚皮
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.beginPath();
    ctx.ellipse(3, 6, 8, 5.5, 0, 0, Math.PI*2);
    ctx.fill();

    // 眼睛
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(6, -4, 5.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#1f2937";
    ctx.beginPath(); ctx.arc(7.6, -3.6, 2.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(8.6, -4.6, 0.9, 0, Math.PI*2); ctx.fill();

    // 嘴
    ctx.fillStyle = "#f97316";
    ctx.beginPath();
    ctx.moveTo(11, 0);
    ctx.lineTo(19, 2.5);
    ctx.lineTo(11, 5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // ===== 交互 =====
  function startGame(){
    ensureAudio();
    reset();
    state = ST.PLAYING;
    document.getElementById("startOverlay").classList.add("hidden");
    document.getElementById("overOverlay").classList.add("hidden");
  }

  function onTap(e){
    if (state === ST.READY){
      startGame();
    } else if (state === ST.PLAYING){
      flap();
    } else if (state === ST.OVER){
      startGame();
    }
    e.preventDefault && e.preventDefault();
  }

  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    onTap(e);
  });

  document.addEventListener("keydown", e => {
    if (e.code === KEY.SPACE || e.code === KEY.UP || e.code === KEY.W){
      e.preventDefault();
      if (e.repeat) return;
      onTap(e);
    }
    if (state === ST.OVER && e.code === KEY.SPACE){
      e.preventDefault();
    }
  });

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("restartBtn").addEventListener("click", startGame);

  // 阻止双击缩放
  document.addEventListener("dblclick", e => e.preventDefault());

  // ===== 启动 =====
  try { best = parseInt(localStorage.getItem("jump-best") || "0", 10) || 0; } catch(e){ best = 0; }
  document.getElementById("bestLine").textContent = "最高分 " + best;
  reset();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
